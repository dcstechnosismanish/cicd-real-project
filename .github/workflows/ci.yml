name: CI Pipeline

on:
  push:
    branches:
      - master

  pull_requst:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.jobs
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci 

      - name: Build Docker Images
        run: docker build -t cicd-real-app:${{ github.sha }} .
        